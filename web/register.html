<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRISP4K - Register</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="nav">
  <div class="logo">CRISP<span>4K</span></div>
  <nav><a href="index.html">Home</a><a href="login.html">Log in</a></nav>
</header>
<main>
  <section class="card">
    <h2>Create your account</h2>
    <p class="muted">Includes 2 free enhancement credits.</p>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Password (8+ characters)" autocomplete="new-password">
    <button id="btn-register">Register</button>
    <p id="out" class="muted"></p>
    <p class="muted">Already have an account? <a href="login.html">Log in</a></p>
  </section>
</main>
<script src="config.js"></script>
<script src="auth-core.js"></script>
<script src="register.js"></script>
</body>
</html>
